[project]
name = "auto-check-event-tracking"
version = "0.1.0"
description = "Auto Check Event Tracking - doi chieu event Firebase Analytics voi bang spec"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
usv-check = "usv.cli_main:main"
usv-record = "usv.cli_record:main"
usv-artifact = "usv.cli_artifact:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Test can device that bi skip mac dinh -> suite chay duoc khi khong cam may.
# Chay rieng bang: pytest -m device
addopts = "-m 'not device'"
markers = [
    "device: can device Android that (mac dinh skip)",
]
